    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('StockFlow ServiceWorker registered:', reg.scope);
          }).catch((err) => {
            console.error('StockFlow ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
